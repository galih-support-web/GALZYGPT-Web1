<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>GALZYGPT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(120deg, #020617, #0f172a, #020617);
  color: white;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  padding: 15px;
  text-align: center;
  font-size: 22px;
  font-weight: bold;
  background: rgba(2,6,23,0.9);
  box-shadow: 0 0 20px #22c55e;
}

header span {
  font-size: 12px;
  display: block;
  color: #94a3b8;
}

#chat {
  flex: 1;
  padding: 15px;
  overflow-y: auto;
}

.bubble {
  padding: 12px;
  border-radius: 14px;
  margin-bottom: 10px;
  max-width: 85%;
  animation: fade 0.3s ease;
}

.user {
  background: #2563eb;
  align-self: flex-end;
  margin-left: auto;
}

.bot {
  background: #1e293b;
  border-left: 4px solid #22c55e;
}

.input-box {
  display: flex;
  padding: 10px;
  background: rgba(2,6,23,0.95);
}

input {
  flex: 1;
  padding: 12px;
  border-radius: 10px;
  border: none;
  outline: none;
  background: #020617;
  color: white;
}

button {
  margin-left: 8px;
  padding: 12px 16px;
  background: #22c55e;
  border: none;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
}

@keyframes fade {
  from {opacity:0; transform:translateY(5px);}
  to {opacity:1;}
}
</style>
</head>

<body>
<header>
  GALZYGPT
  <span>AI Web Assistant</span>
</header>

<div id="chat">
  <div class="bubble bot">
    👋 Halo! Aku <b>GALZYGPT</b><br>
    Tanyain apa aja ke aku 😄
  </div>
</div>

<div class="input-box">
  <input id="input" placeholder="Tulis pertanyaanmu...">
  <button onclick="send()">Kirim</button>
</div>

<script>
async function send() {
  const input = document.getElementById("input");
  const chat = document.getElementById("chat");
  if (!input.value) return;

  chat.innerHTML += `<div class="bubble user">${input.value}</div>`;
  chat.scrollTop = chat.scrollHeight;

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: input.value })
    });
    const data = await res.json();
    const aiMsg = data.reply || "🤖 GALZYGPT error, coba lagi.";
    chat.innerHTML += `<div class="bubble bot">${aiMsg}</div>`;
    chat.scrollTop = chat.scrollHeight;
  } catch (err) {
    chat.innerHTML += `<div class="bubble bot">🤖 GALZYGPT error, AI tidak bisa dihubungi.</div>`;
  }

  input.value = "";
}
</script>

</body>
</html>
